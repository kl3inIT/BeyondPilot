allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  sharp: false
  unrs-resolver: false
auditConfig:
  # braces <=3.0.3 has a stack-exhaustion advisory with no patched release. It reaches us only
  # through build-time tooling (the shadcn CLI) that never receives
  # untrusted glob patterns. Drop this once braces ships a fix and fast-glob/micromatch pick it up.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAgeExclude:
  - "@next/env@16.4.0"
  - "@next/swc-darwin-arm64@16.4.0"
  - "@next/swc-darwin-x64@16.4.0"
  - "@next/swc-linux-arm64-gnu@16.4.0"
  - "@next/swc-linux-arm64-musl@16.4.0"
  - "@next/swc-linux-x64-gnu@16.4.0"
  - "@next/swc-linux-x64-musl@16.4.0"
  - "@next/swc-win32-arm64-msvc@16.4.0"
  - "@next/swc-win32-x64-msvc@16.4.0"
  - next@16.4.0
overrides:
  # @hey-api/json-schema-ref-parser 1.4.4 pins js-yaml 4.2.0, which has high advisories
  # (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh). Drop this once Hey API
  # releases a parser on js-yaml 4.3.2 or later.
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  # vite 8.3.0 to 8.3.2, pulled in by vitest, has a high advisory (GHSA-587h-7wmj-h5pm). Drop this
  # once vitest resolves vite 8.3.3 or later on its own.
  "vite@>=8.3.0 <8.3.3": 8.3.4
  # undici before 7.30.1 (through the shadcn CLI) and before 8.12.2 (through jsdom) has a high
  # advisory (GHSA-xjj6-f33q-929c). Drop these once shadcn and jsdom resolve patched releases.
  "undici@>=7.18.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.2": 8.12.3
