              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The profile changed since it was read.
      security:
      - session: []
      summary: Save the caller's talent profile; the first save creates it
      tags:
      - My talent profile
  /api/talent/mine/submit:
    post:
      operationId: submitMyTalentProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TalentProfile"
          description: "The profile, waiting for review."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The profile lacks what a submission needs.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller has no profile.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The profile is already submitted or approved.
      security:
      - session: []
      summary: Send the caller's talent profile to GenAI Fund for review
      tags:
      - My talent profile
  /api/talent/profiles:
    get:
      operationId: listTalent
      parameters:
      - description: "Profiles whose name, headline or a skill contains this, ignoring\
          \ case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only profiles with this role.
        in: query
        name: role
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: ai_engineer|ml_engineer|forward_deployed_engineer|automation_specialist|data_scientist|data_engineer|ai_product_manager|ai_consultant|ai_designer|other
      - description: Only profiles of this availability.
        in: query
        name: availability
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: available|open_to_offers|not_available
      - description: "The order: by name, or the most recently approved first."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: name
          enum:
          - name
          - newest
          pattern: name|newest
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTalentList"
          description: One page of the profiles the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
      summary: "The approved, listed talent profiles, in the order asked for"
      tags:
      - Talent
  /api/talent/profiles/{slug}:
    get:
      operationId: getTalent
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTalent"
          description: The profile.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No approved, listed profile has this address."
      summary: One talent profile of the directory by its address
      tags:
      - Talent
  /api/talent/profiles/{slug}/enquiries:
    post:
      operationId: sendTalentEnquiry
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTalentEnquiry"
        required: true
      responses:
        "204":
          description: The message was sent to the person by email.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The message is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No approved, listed profile has this address."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The profile is the caller's own.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller already wrote through this profile within a day.
      security:
      - session: []
      summary: Send a message to the person behind a talent profile
      tags:
      - Talent
components:
  schemas:
    AccountList:
      type: object
      description: "One page of accounts, latest sign-in first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
          description: How many accounts a page holds.
        total:
          type: integer
          format: int64
          description: "How many accounts match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AccountSummary:
      type: object
      description: One account in the operators' list.
      properties:
        configuredOperator:
          type: boolean
          description: "The server configuration names this address as an operator,\
            \ so the role cannot be withdrawn here."
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        lastSignInAt:
          type:
          - string
          - "null"
          format: date-time
          description: The last completed sign-in.
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
        status:
          type: string
          description: A disabled account cannot sign in.
          enum:
          - active
          - disabled
      required:
      - configuredOperator
      - createdAt
      - email
      - id
      - role
      - status
    AdminCreateOrganization:
      type: object
      description: "An organization an operator creates for a company that is not\
        \ here yet. It is approved from the start and has no member until someone\
        \ accepts the invitation to own it, or claims it."
      properties:
        country:
          type:
          - string
          - "null"
          description: ISO 3166-1 alpha-2.
          pattern: "[A-Z]{2}"
        emailDomain:
          type:
          - string
          - "null"
          description: "The domain of the company's work addresses, which the operator\
            \ vouches for."
          example: tasco.com.vn
          maxLength: 253
          minLength: 0
          pattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+"
        name:
          type: string
          maxLength: 120
          minLength: 0
        ownerEmail:
          type:
          - string
          - "null"
          format: email
          description: The address invited to own it.
          maxLength: 254
          minLength: 0
        type:
          type: string
          enum:
          - company
          - builder_team
          - independent_builder
          - other
          pattern: company|builder_team|independent_builder|other
        website:
          type:
          - string
          - "null"
          maxLength: 300
          minLength: 0
          pattern: "https?://[^\\s]+"
      required:
      - name
      - type
    AdminOrganization:
      type: object
      description: One organization as an operator reviews it.
      properties:
        claims:
          type: array
          description: The open requests to own it; empty for an owned organization.
          items:
            $ref: "#/components/schemas/OrganizationJoinRequest"
        createdBy:
          type: string
          description: "Who created it, as they are shown."
        createdByEmail:
          type: string
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationInvitation"
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"
        organization:
          $ref: "#/components/schemas/Organization"
        suggestedDomain:
          type:
          - string
          - "null"
          description: "A domain the operator may verify with a decision: the one\
            \ it has, else the creator's work domain while it waits for review, else\
            \ its website's. Null when another organization holds it."
      required:
      - claims
      - createdBy
      - createdByEmail
      - invitations
      - members
      - organization
    AdminOrganizationList:
      type: object
      description: "One page of organizations: those waiting for review first, then\
        \ the newest."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrganizationSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: "How many organizations match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AdminOrganizationSummary:
      type: object
      description: One organization in the operators' list.
      properties:
        askedBy:
          type:
          - string
          - "null"
          description: "Who asked for what waits, as they are shown."
        claimId:
          type:
          - string
          - "null"
          format: uuid
          description: "The oldest open claim, which the list decides first; null\
            \ without one."
        country:
          type:
          - string
          - "null"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        members:
          type: integer
          format: int32
        name:
          type: string
        owned:
          type: boolean
          description: Whether a person owns it; an operator-created organization
            has no owner until someone accepts or claims it.
        request:
          type:
          - string
          - "null"
          description: "What waits for an operator: `new` for an organization to review,\
            \ `claim` for a request to own one; null when nothing does."
          enum:
          - new
          - claim
        requestedAt:
          type:
          - string
          - "null"
          format: date-time
          description: When they asked.
        slug:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        type:
          type: string
          enum:
          - company
          - builder_team
          - independent_builder
          - other
      required:
      - createdAt
      - id
      - members
      - name
      - owned
      - slug
      - status
      - type
    AdminProgram:
      type: object
      description: "A program as an operator edits it, in any status."
      properties:
        about:
          type:
          - string
          - "null"
          description: The text of the standard page.
        applications:
          $ref: "#/components/schemas/ProgramApplications"
          description: Null for a program that takes no applications here.
        coverFileId:
          type:
          - string
          - "null"
          format: uuid
          description: "The cover, read at the public address of stored files."
        createdAt:
          type: string
          format: date-time
        endsOn:
          type:
          - string
          - "null"
          format: date
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProgramEvent"
        externalUrl:
          type:
          - string
          - "null"
          format: uri
        id:
          type: string
          format: uuid
        keyDates:
          type: array
          items:
            $ref: "#/components/schemas/ProgramKeyDate"
        name:
          type: string
        pageKind:
          type: string
          description: "`standard` is built from these fields, `custom` is written\
            \ in the web application for this address, `external` links to `externalUrl`."
          enum:
          - standard
          - custom
          - external
        partnerName:
          type:
          - string
          - "null"
          description: The organization the program is run with.
        publishIssues:
          type: array
          description: "What the program still lacks before it can be published, in\
            \ the order the Settings screen shows its fields. Empty when it can be\
            \ published."
          items:
            type: string
            enum:
            - summary
            - cover
            - dates
        slug:
          type: string
          description: The address under /programs.
        slugFixed:
          type: boolean
          description: "The program has been published at least once, so its address\
            \ cannot change."
        startsOn:
          type:
          - string
          - "null"
          format: date
        status:
          type: string
          description: Only a published program is public.
          enum:
          - draft
          - published
        summary:
          type:
          - string
          - "null"
          description: "One or two sentences, shown on the list."
        type:
          type: string
          enum:
          - enterprise_challenge
          - open_innovation_call
          - accelerator
          - hackathon
          - buildathon
          - grant
          - venture_building
          - pitch_competition
          - event_series
          - event
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: "Sent back with a save, which is refused when someone else\
            \ saved in the meantime."
      required:
      - createdAt
      - events
      - id
      - keyDates
      - name
      - pageKind
      - publishIssues
      - slug
      - slugFixed
      - status
      - type
      - updatedAt
      - version
    AdminProgramList:
      type: object
      description: "Every program, the newest first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminProgramSummary"
      required:
      - items
    AdminProgramSummary:
      type: object
      description: One program in the operators' list.
      properties:
        applications:
          $ref: "#/components/schemas/ProgramApplications"
          description: Null for a program that takes no applications here.
        coverFileId:
          type:
          - string
          - "null"
          format: uuid
          description: "The cover, read at the public address of stored files."
        endsOn:
          type:
          - string
          - "null"
          format: date
        id:
          type: string
          format: uuid
        name:
          type: string
        partnerName:
          type:
          - string
          - "null"
        phase:
          type: string
          description: "Where the program would stand now, worked out from its dates;\
            \ a draft is shown as a draft whatever its phase."
          enum:
          - upcoming
          - open
          - running
          - done
        slug:
          type: string
        startsOn:
          type:
          - string
          - "null"
          format: date
        status:
          type: string
          enum:
          - draft
          - published
        type:
          type: string
          enum:
          - enterprise_challenge
          - open_innovation_call
          - accelerator
          - hackathon
          - buildathon
          - grant
          - venture_building
          - pitch_competition
          - event_series
          - event
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - phase
      - slug
      - status
      - type
      - updatedAt
    AdminSolutionList:
      type: object
      description: "One page of submitted solutions: those waiting for review first,\
        \ the longest wait on top."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SolutionSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: "How many solutions match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AdminTalent:
      type: object
      description: A talent profile as an operator reviews it.
      properties:
        email:
          type: string
          description: The address of the account the profile belongs to.
        profile:
          $ref: "#/components/schemas/TalentProfile"
      required:
      - email
      - profile
    AdminTalentList:
      type: object
      description: "One page of submitted talent profiles: those waiting for review\
        \ first, the longest wait on top."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TalentSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: "How many profiles match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    ApproveOrganization:
      type: object
      description: "What an operator vouches for with an approval, of a new organization\
        \ or of a claim to own one: the domain of the organization's work addresses,\
        \ or none."
      properties:
        emailDomain:
          type:
          - string
          - "null"
          description: The verified domain; null leaves the organization as it is.
          example: tasco.com.vn
          maxLength: 253
          minLength: 0
          pattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+"
    AuditEvent:
      type: object
      description: "One recorded change: who did what to what, and when."
      properties:
        action:
          type: string
          enum:
          - account.disable
          - account.enable
          - operator.grant
          - operator.withdraw
          - program.create
          - program.update
          - program.publish
          - program.unpublish
          - organization.create
          - organization.approve
          - organization.refuse
          - organization.claim_approve
          - organization.claim_decline
          - organization.member_role
          - organization.member_remove
          - solution.approve
          - solution.reject
          - solution.deployment_approve
          - solution.deployment_reject
          - talent.approve
          - talent.reject
        actor:
          type:
          - object
          - "null"
          $ref: "#/components/schemas/AuditEventActor"
          description: Who did it; null when the server configuration did.
        details:
          type: object
          additionalProperties:
            type: string
          description: "The fields the action declares, each as text."
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type:
          - string
          - "null"
          format: uuid
          description: "The request that made the change, as logged and returned in\
            \ X-Request-Id."
        resource:
          $ref: "#/components/schemas/AuditEventResource"
      required:
      - action
      - details
      - id
      - occurredAt
      - resource
    AuditEventActor:
      type: object
      description: "The person who acted, as they were named at that moment."
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        label:
          type: string
      required:
      - email
      - id
      - label
    AuditEventList:
      type: object
      description: "One page of audit events, newest first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        newer:
          type:
          - string
          - "null"
          description: Pass as `after` for the page towards the present; null on the
            newest page.
        older:
          type:
          - string
          - "null"
          description: Pass as `before` for the page towards the past; null on the
            oldest page.
      required:
      - items
    AuditEventResource:
      type: object
      description: "What was acted on, with the name it had at that moment."
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
      required:
      - id
      - label
      - type
    AutoJoin:
      type: object
      description: Whether an address on the organization's domain joins without asking.
      properties:
        autoJoin:
          type: boolean
      required:
      - autoJoin
    ChangeMemberRole:
      type: object
      properties:
        role:
          type: string
          enum:
          - owner
          - member
          pattern: owner|member
      required:
      - role
    CreateOrganization:
      type: object
      description: "A new organization. Its creator owns it, and it waits for GenAI\
        \ Fund's review."
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: "[A-Z]{2}"
        description:
          type: string
          description: "What it does and for whom, in at most 280 characters."
          maxLength: 280
          minLength: 0
        foundedYear:
          type: integer
          format: int32
          description: "The year it started; for an independent builder, the year\
            \ the practice did."
          maximum: 2100
          minimum: 1800
        industries:
          type: array
          description: "The industries it works in or serves, as the codes the solutions\
            \ use."
          items:
            type: string
            pattern: banking_finance|insurance|retail_ecommerce|manufacturing|logistics|healthcare|education|real_estate|telecom|energy|agriculture|travel_hospitality|media_entertainment|public_sector|professional_services|technology|automotive_mobility|consumer_goods|other
          maxItems: 5
          minItems: 1
        jobTitle:
          type: string
          description: What the creator does in the organization.
          maxLength: 120
          minLength: 0
        logoUrl:
          type:
          - string
          - "null"
          description: The address of its logo.
          maxLength: 300
          minLength: 0
          pattern: "https?://[^\\s]+"
        name:
          type: string
          maxLength: 120
          minLength: 0
        teamSize:
          type: string
          pattern: just_me|2_9|10_49|50_99|100_499|500_999|1000_4999|5000_plus
        type:
          type: string
          enum:
          - company
          - builder_team
          - independent_builder
          - other
          pattern: company|builder_team|independent_builder|other
        website:
          type: string
          maxLength: 300
          minLength: 0
          pattern: "https?://[^\\s]+"
      required:
      - country
      - description
      - foundedYear
      - industries
      - jobTitle
      - name
      - teamSize
      - type
      - website
    CreateProgram:
      type: object
      description: What a program cannot do without. It is created as a draft.
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        slug:
          type: string
          description: "The address under /programs: lowercase letters, digits and\
            \ single hyphens."
          example: insurance-ai-tasco
          maxLength: 60
          minLength: 3
          pattern: "[a-z0-9]+(-[a-z0-9]+)*"
        type:
          type: string
          enum:
          - enterprise_challenge
          - open_innovation_call
          - accelerator
          - hackathon
          - buildathon
          - grant
          - venture_building
          - pitch_competition
          - event_series
          - event
          pattern: enterprise_challenge|open_innovation_call|accelerator|hackathon|buildathon|grant|venture_building|pitch_competition|event_series|event
      required:
      - name
      - slug
      - type
    CreateSolution:
      type: object
      description: What a solution cannot do without. It is created as a draft.
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - name
    CustomerDeployment:
      type: object
      description: "A customer deployment of a solution as its organization, and operators,\
        \ see it."
      properties:
        channels:
          type:
          - string
          - "null"
        customer:
          type: string
        decisionMessage:
          type:
          - string
          - "null"
          description: What the operator wrote to the owners with the rejection.
        decisionReason:
          type:
          - string
          - "null"
          description: Why it was last rejected.
          enum:
          - incomplete
          - unverifiable
          - other
        delivered:
          type: string
        id:
          type: string
          format: uuid
        languages:
          type:
          - string
          - "null"
        period:
          type:
          - string
          - "null"
        problem:
          type: string
        result:
          type:
          - string
          - "null"
        stage:
          type: string
          enum:
          - pilot
          - production
        status:
          type: string
          enum:
          - submitted
          - approved
          - rejected
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
