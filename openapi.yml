openapi: 3.1.0
info:
  description: The same-origin contract consumed by the BeyondPilot web application.
  title: BeyondPilot API
  version: 1.0.0
servers:
- description: Same origin as the web application
  url: /
tags:
- description: The accounts operators manage.
  name: Accounts
- description: Who is signed in.
  name: Identity
- description: Uploading and reading files.
  name: Storage
paths:
  /api/identity/accounts:
    get:
      operationId: listAccounts
      parameters:
      - description: "Accounts whose name or address contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only accounts of this status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - disabled
          pattern: active|disabled
      - description: Only accounts of this role.
        in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - user
          - operator
          pattern: user|operator
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
          description: One page of the accounts the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The accounts, latest sign-in first"
      tags:
      - Accounts
  /api/identity/accounts/{id}/disable:
    post:
      operationId: disableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is disabled.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account is the caller's own.
      security:
      - session: []
      summary: Stop an account from signing in
      tags:
      - Accounts
  /api/identity/accounts/{id}/enable:
    post:
      operationId: enableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is active.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Let a disabled account sign in again
      tags:
      - Accounts
  /api/identity/accounts/{id}/grant-operator:
    post:
      operationId: grantOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Make an account an operator
      tags:
      - Accounts
  /api/identity/accounts/{id}/withdraw-operator:
    post:
      operationId: withdrawOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is not an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The account is the caller's own, or the server configuration\
            \ names it as an operator."
      security:
      - session: []
      summary: Take the operator role from an account
      tags:
      - Accounts
  /api/identity/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The account of the session.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account has been disabled.
      security:
      - session: []
      summary: The signed-in account
      tags:
      - Identity
  /api/storage/files/{id}:
    get:
      description: "The bytes of a file anyone may read, such as an image of a program,\
        \ or a redirect to where the object store serves them. No session is needed."
      operationId: getPublicFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The bytes of the file.
        "302":
          description: "The address the object store serves the file at, for a while."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No stored public file has this identifier.
      summary: A public file
      tags:
      - Storage
  /api/storage/uploads:
    post:
      description: "The first of three steps: reserve, send the bytes as the ticket\
        \ says, confirm."
      operationId: reserveUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveUpload"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
          description: The pending file and where to send its bytes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The purpose refuses this media type or this size.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller may not upload for this purpose.
      security:
      - session: []
      summary: Reserve an upload
      tags:
      - Storage
  /api/storage/uploads/{id}/confirm:
    post:
      description: Checks that the bytes arrived and are the announced file. Only
        then can the file be used.
      operationId: confirmUpload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredFile"
          description: The stored file.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The uploaded bytes are not the announced file.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller has no such upload.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nothing has been uploaded yet.
      security:
      - session: []
      summary: Confirm an upload
      tags:
      - Storage
  /api/storage/uploads/{id}/content:
    put:
      description: The address a ticket names when the object store receives uploads
        through this application. The body is the file; the token works once.
      operationId: sendUploadContent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The bytes are written.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body is not the announced length.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The token is not valid or has been used.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller has no such pending upload.
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The ticket has expired.
      security:
      - session: []
      summary: Send the bytes of an upload
      tags:
      - Storage
components:
  schemas:
    AccountList:
      type: object
      description: "One page of accounts, latest sign-in first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
          description: How many accounts a page holds.
        total:
          type: integer
          format: int64
          description: "How many accounts match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AccountSummary:
      type: object
      description: One account in the operators' list.
      properties:
        configuredOperator:
          type: boolean
          description: "The server configuration names this address as an operator,\
            \ so the role cannot be withdrawn here."
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        lastSignInAt:
          type:
          - string
          - "null"
          format: date-time
          description: The last completed sign-in.
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
        status:
          type: string
          description: A disabled account cannot sign in.
          enum:
          - active
          - disabled
      required:
      - configuredOperator
      - createdAt
      - email
      - id
      - role
      - status
    Me:
      type: object
      description: The signed-in account.
      properties:
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
      required:
      - email
      - id
      - role
    Problem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable failure code for module failures and request validation;
            clients branch on it.
          maxLength: 63
          pattern: "^[A-Z][A-Z0-9_]+[A-Z0-9]$"
        detail:
          type: string
          description: Safe human-readable explanation; never branch on it.
        errors:
          type: array
          description: "Request validation only: one entry per violation. A rejected\
            \ value is never echoed."
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                description: "Constraint code, for example `NOT_BLANK` or `SIZE`."
                pattern: "^[A-Z][A-Z0-9_]+[A-Z0-9]$"
              detail:
                type: string
                description: Safe fallback text; clients translate by code.
              params:
                type: object
                additionalProperties: false
                description: Numeric bounds of the constraint; omitted when it has
                  none.
                properties:
                  max:
                    type: number
                  min:
                    type: number
              pointer:
                type: string
                description: "JSON Pointer to the offending member, for example `#/title`."
            required:
            - code
            - detail
            - pointer
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        requestId:
          type: string
          format: uuid
          description: Identifier of the request in the server logs and the `X-Request-Id`
            header.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short summary of the problem kind; never branch on it.
        type:
          type: string
          format: uri
          description: '`urn:beyondpilot:failure:<code in kebab case>` when `code`
            is present; omitted means `about:blank`.'
      required:
      - requestId
      - status
      - title
    ReserveUpload:
      type: object
      description: The file a person is about to upload.
      properties:
        fileName:
          type: string
          description: "The name of the file, kept to show and to download under."
          maxLength: 255
          minLength: 0
        mediaType:
          type: string
          example: application/pdf
          maxLength: 127
          minLength: 0
        purpose:
          type: string
          description: Why the file is uploaded; it fixes the allowed media types
            and the largest size.
          enum:
          - program_image
          - application_file
        sizeBytes:
          type: integer
          format: int64
          description: The exact length of the file in bytes.
          exclusiveMinimum: 0
      required:
      - fileName
      - mediaType
      - purpose
      - sizeBytes
    StoredFile:
      type: object
      description: A file whose upload is confirmed.
      properties:
        fileName:
          type: string
        id:
          type: string
          format: uuid
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
      required:
      - fileName
      - id
      - mediaType
      - sizeBytes
    UploadTicket:
      type: object
      description: "Permission to send the bytes of one file. Send them as the request\
        \ says, then confirm."
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the permission ends.
        headers:
          type: object
          additionalProperties:
            type: string
          description: The headers the request must carry.
        id:
          type: string
          format: uuid
          description: "The file, pending until confirmed."
        method:
          type: string
          example: PUT
        url:
          type: string
          description: "Where to send the bytes: an address of the object store, or\
            \ a path of this application."
      required:
      - expiresAt
      - headers
      - id
      - method
      - url
  securitySchemes:
    session:
      description: "The session cookie set by signing in. Requests that change state\
        \ also send `X-BeyondPilot-CSRF: 1`."
      in: cookie
      name: BEYONDPILOT_SESSION
      type: apiKey
