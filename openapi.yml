  /api/search:
    get:
      description: "Matches words with or without Vietnamese marks, the start of the\
        \ last word, and typos in titles."
      operationId: search
      parameters:
      - description: "What to search for, as the person typed it."
        in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - description: Only items of this kind; every kind when absent.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - program
          - solution
          - talent
          - use_case
          pattern: program|solution|talent|use_case
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
          description: A page of results and the counts of every kind.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The query is missing or too long, or a parameter is not valid."
      summary: "What matches the query, best first"
      tags:
      - Search
