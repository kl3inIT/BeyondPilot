        published:
          type: boolean
          description: Whether visitors see the program; a draft is for operators
            only.
        slug:
          type: string
          description: The address of its public page.
      required:
      - id
      - name
      - published
      - slug
    UseCaseRequirement:
      type: object
      description: One thing the solution must do.
      properties:
        necessity:
          type: string
          enum:
          - required
          - optional
          pattern: required|optional
        statement:
          type: string
          maxLength: 300
          minLength: 0
      required:
      - necessity
      - statement
  securitySchemes:
    session:
      description: "The session cookie set by signing in. Requests that change state\
        \ also send `X-BeyondPilot-CSRF: 1`."
      in: cookie
      name: BEYONDPILOT_SESSION
      type: apiKey
