openapi: 3.1.0
info:
  description: The same-origin contract consumed by the BeyondPilot web application.
  title: BeyondPilot API
  version: 1.0.0
servers:
- description: Same origin as the web application
  url: /
tags:
- description: "Scoring a program's applications, deciding on them and releasing the\
    \ outcomes."
  name: Review
- description: "The record of sensitive changes, read by operators."
  name: Audit
- description: "The programs GenAI Fund runs, as the public site shows them."
  name: Programs
- description: The public directory of approved talent profiles.
  name: Talent
- description: The organizations operators review.
  name: Organization administration
- description: Requests for an introduction to the organization behind a solution.
  name: Introductions
- description: The programs operators create and edit.
  name: Program administration
- description: A person's applications to programs.
  name: Applications
- description: "Search over the programs, solutions and talent the public site shows."
  name: Search
- description: The projects in which a customer put a solution to work.
  name: Customer deployments
- description: The caller's own talent profile.
  name: My talent profile
- description: The use cases operators write and read.
  name: Use case administration
- description: The solutions operators review.
  name: Solution administration
- description: The solutions of the caller's organization.
  name: My solutions
- description: The accounts operators manage.
  name: Accounts
- description: "Reports of delivery, bounces and complaints, sent by the email provider\
    \ and checked by signature."
  name: Email delivery events
- description: The public directory of approved AI solutions.
  name: Solutions
- description: The requests for an introduction operators read.
  name: Introduction administration
- description: The organization the caller belongs to.
  name: My organization
- description: Who is signed in.
  name: Identity
- description: The use cases the members of an organization write.
  name: My organization's use cases
- description: Uploading and reading files.
  name: Storage
- description: The public list of published use cases.
  name: Use cases
- description: "Who delivers BeyondPilot's email, its wording, what was sent and the\
    \ addresses it is not sent to."
  name: Email administration
- description: The talent profiles operators review.
  name: Talent administration
- description: "The AI providers operators connect, the model search embeds with,\
    \ and the state of the search index."
  name: AI and search administration
- description: "Finding, joining and creating an organization."
  name: Organizations
paths:
  /api/audit/events:
    get:
      operationId: listAuditEvents
      parameters:
      - description: Only events at or after this instant.
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: Only events of this action.
        in: query
        name: action
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - account.disable
          - account.enable
          - operator.grant
          - operator.withdraw
          - program.create
          - program.update
          - program.publish
          - program.unpublish
          - organization.create
          - organization.approve
          - organization.suspend
          - organization.restore
          - organization.update
          - organization.invite
          - organization.invitation_revoke
          - organization.refuse
          - organization.send_back
          - organization.claim_approve
          - organization.claim_decline
          - organization.member_role
          - organization.member_remove
          - solution.approve
          - solution.send_back
          - solution.reject
          - solution.take_down
          - solution.restore
          - solution.back
          - solution.deployment_approve
          - solution.deployment_reject
          - use_case.create
          - use_case.submit
          - use_case.draft
          - use_case.approve
          - use_case.send_back
          - use_case.set_programs
          - introduction.reply
          - introduction.decline
          - talent.approve
          - talent.reject
          - talent.enquiry_accept
          - talent.enquiry_decline
          - talent.enquiry_report
          - talent.request_changes
          - talent.remove
          - talent.restore
          - talent.delete
          - proposal.criteria_update
          - proposal.reviewer_invite
          - proposal.reviewer_remove
          - proposal.decide
          - proposal.release
          - email.settings_update
          - email.appearance_update
          - email.template_update
          - email.template_reset
          - email.suppression_add
          - email.suppression_remove
          - email.resend
          - email.test_send
          - ai.provider_create
          - ai.provider_update
          - ai.provider_delete
          - search.model_change
          - search.semantic_enable
          - search.semantic_disable
          - search.index_rebuild
          - search.embedding_retry
      - description: "Events whose actor's name or address, or whose resource's name,\
          \ contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: "The `older` cursor of a page: the events before it. Used when\
          \ both cursors are given."
        in: query
        name: before
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      - description: "The `newer` cursor of a page: the events after it."
        in: query
        name: after
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: One page of the events the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The audit events, newest first"
      tags:
      - Audit
  /api/identity/accounts:
    get:
      operationId: listAccounts
      parameters:
      - description: "Accounts whose name or address contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only accounts of this status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - disabled
          pattern: active|disabled
      - description: Only accounts of this role.
        in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - user
          - operator
          pattern: user|operator
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
          description: One page of the accounts the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The accounts, latest sign-in first"
      tags:
      - Accounts
  /api/identity/accounts/{id}/disable:
    post:
      operationId: disableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is disabled.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account is the caller's own.
      security:
      - session: []
      summary: Stop an account from signing in
      tags:
      - Accounts
  /api/identity/accounts/{id}/enable:
    post:
      operationId: enableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is active.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Let a disabled account sign in again
      tags:
      - Accounts
  /api/identity/accounts/{id}/grant-operator:
    post:
      operationId: grantOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Make an account an operator
      tags:
      - Accounts
  /api/identity/accounts/{id}/withdraw-operator:
    post:
      operationId: withdrawOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is not an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The account is the caller's own, or the server configuration\
            \ names it as an operator."
      security:
      - session: []
      summary: Take the operator role from an account
      tags:
      - Accounts
  /api/identity/apps/connecting:
    get:
      operationId: getConnectingApp
      parameters:
      - in: query
        name: clientId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectingApp"
          description: The app the consent page names.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No such app may sign in.
      security:
      - session: []
      summary: The AI app asking to connect
      tags:
      - Identity
  /api/identity/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The account of the session.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account has been disabled.
      security:
      - session: []
      summary: The signed-in account
      tags:
      - Identity
  /api/introduction/admin/introductions:
    get:
      operationId: listAdminIntroductions
      parameters:
      - description: "Requests about a solution whose name contains this, ignoring\
          \ case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only requests in this state.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - pending
          - replied
          - declined
          pattern: pending|replied|declined
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIntroductionList"
          description: One page of the requests the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The requests for an introduction, those that wait first and the longest\
        \ wait on top"
      tags:
      - Introduction administration
  /api/introduction/introductions:
    post:
      operationId: requestIntroduction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestIntroduction"
        required: true
      responses:
        "204":
          description: The request was recorded and the provider's owners were told.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The solution or the message is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller belongs to no approved organization.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No approved solution has the address.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The solution is the caller's own, or an earlier request about\
            \ it still waits."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody at the provider can be asked right now.
      security:
      - session: []
      summary: Ask for an introduction to the organization behind a solution
      tags:
      - Introductions
  /api/introduction/mine/received:
    get:
      operationId: getReceivedIntroductions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedIntroductions"
          description: "The requests, newest first."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller belongs to no organization.
      security:
      - session: []
      summary: The requests for an introduction to the caller's organization
      tags:
      - Introductions
  /api/introduction/mine/received/{id}/decline:
    post:
      operationId: declineIntroduction
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The request was declined and the sender was told.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an owner of the organization asked.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The organization asked has no such request.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was answered already.
      security:
      - session: []
      summary: Decline a request; the sender learns no address
      tags:
      - Introductions
  /api/introduction/mine/received/{id}/reply:
    post:
      operationId: replyToIntroduction
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The request was replied to and both sides were told.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an owner of the organization asked.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The organization asked has no such request.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The request was answered already.
      security:
      - session: []
      summary: "Accept a request: both sides learn each other's address"
      tags:
      - Introductions
  /api/notification/admin/email/messages:
    get:
      operationId: listEmailMessages
      parameters:
      - description: Only emails queued at or after this instant; the counts cover
          the same period.
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: Only emails of this kind.
        in: query
        name: kind
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "[a-z_]{1,40}"
      - description: Only emails in this state.
        in: query
        name: status
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: queued|sent|delivered|bounced|complained|failed|skipped
      - description: "Emails whose recipient or subject contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: "The `older` cursor of a page: the emails before it."
        in: query
        name: before
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      - description: "The `newer` cursor of a page: the emails after it."
        in: query
        name: after
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessageList"
          description: "One page, its cursors and the counts of the period."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A filter or a cursor is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The email log, newest first, a page at a time"
      tags:
      - Email administration
  /api/notification/admin/email/messages/{id}:
    get:
      operationId: getEmailMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessage"
          description: The email.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such email.
      security:
      - session: []
      summary: "One email as it was sent, with what happened to it"
      tags:
      - Email administration
  /api/notification/admin/email/messages/{id}/resend:
    post:
      operationId: resendEmailMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailResent"
          description: "The new email, queued."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such email.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "It is a sign-in code, or its address is suppressed."
      security:
      - session: []
      summary: "Send an email again, as it was sent, to the same address"
      tags:
      - Email administration
  /api/notification/admin/email/settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
          description: The settings.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The email settings, without their secrets"
      tags:
      - Email administration
    put:
      operationId: saveEmailSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEmailSettings"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
          description: "The settings as saved, with their new version."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "A member is not valid, or the provider chosen lacks a field\
            \ or its secret."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The settings changed since they were read.
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A secret was given but the server has no key to encrypt it.
      security:
      - session: []
