openapi: 3.1.0
info:
  description: The same-origin contract consumed by the BeyondPilot web application.
  title: BeyondPilot API
  version: 1.0.0
servers:
- description: Same origin as the web application
  url: /
tags:
- description: "The record of sensitive changes, read by operators."
  name: Audit
- description: The accounts operators manage.
  name: Accounts
- description: "The programs GenAI Fund runs, as the public site shows them."
  name: Programs
- description: Who is signed in.
  name: Identity
- description: Uploading and reading files.
  name: Storage
- description: The programs operators create and edit.
  name: Program administration
paths:
  /api/audit/events:
    get:
      operationId: listAuditEvents
      parameters:
      - description: Only events at or after this instant.
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: Only events of this action.
        in: query
        name: action
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - account.disable
          - account.enable
          - operator.grant
          - operator.withdraw
          - program.create
          - program.update
          - program.publish
          - program.unpublish
      - description: "Events whose actor's name or address, or whose resource's name,\
          \ contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: "The `older` cursor of a page: the events before it. Used when\
          \ both cursors are given."
        in: query
        name: before
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      - description: "The `newer` cursor of a page: the events after it."
        in: query
        name: after
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: One page of the events the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The audit events, newest first"
      tags:
      - Audit
  /api/identity/accounts:
    get:
      operationId: listAccounts
      parameters:
      - description: "Accounts whose name or address contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only accounts of this status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - disabled
          pattern: active|disabled
      - description: Only accounts of this role.
        in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - user
          - operator
          pattern: user|operator
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
          description: One page of the accounts the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The accounts, latest sign-in first"
      tags:
      - Accounts
  /api/identity/accounts/{id}/disable:
    post:
      operationId: disableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is disabled.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account is the caller's own.
      security:
      - session: []
      summary: Stop an account from signing in
      tags:
      - Accounts
  /api/identity/accounts/{id}/enable:
    post:
      operationId: enableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is active.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Let a disabled account sign in again
      tags:
      - Accounts
  /api/identity/accounts/{id}/grant-operator:
    post:
      operationId: grantOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Make an account an operator
      tags:
      - Accounts
  /api/identity/accounts/{id}/withdraw-operator:
    post:
      operationId: withdrawOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is not an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The account is the caller's own, or the server configuration\
            \ names it as an operator."
      security:
      - session: []
      summary: Take the operator role from an account
      tags:
      - Accounts
  /api/identity/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The account of the session.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account has been disabled.
      security:
      - session: []
      summary: The signed-in account
      tags:
      - Identity
  /api/program/admin/programs:
    get:
      operationId: listAdminPrograms
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProgramList"
          description: Every program in any status.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "Every program, the newest first"
      tags:
      - Program administration
    post:
      operationId: createProgram
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgram"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProgram"
          description: The draft.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A member is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Another program already has this address.
      security:
      - session: []
      summary: Create a program as a draft
      tags:
      - Program administration
  /api/program/admin/programs/{id}:
    get:
      operationId: getAdminProgram
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProgram"
          description: The program.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such program.
      security:
      - session: []
      summary: One program as an operator edits it
      tags:
      - Program administration
    put:
      operationId: saveProgram
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgram"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProgram"
          description: "The program as saved, with its new version."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "A member is not valid, dates are out of order, or the cover\
            \ is not a stored image of the caller."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such program.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The program changed since it was read, or its address is taken\
            \ or can no longer change."
      security:
      - session: []
      summary: "Save a program with its application window, key dates and events"
      tags:
      - Program administration
  /api/program/admin/programs/{id}/publish:
    post:
      operationId: publishProgram
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The program is published. Its address is fixed from now on.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The program still lacks what its publishIssues list; nothing
            changed.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such program.
      security:
      - session: []
      summary: Put a program on the public site
      tags:
      - Program administration
  /api/program/admin/programs/{id}/unpublish:
    post:
      operationId: unpublishProgram
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The program is a draft again; it keeps its address.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such program.
      security:
      - session: []
      summary: Take a program off the public site
      tags:
      - Program administration
  /api/program/programs:
    get:
      operationId: listPrograms
      parameters:
      - description: Only programs in this phase today.
        in: query
        name: phase
        required: false
        schema:
          type: string
          enum:
          - upcoming
          - open
          - running
          - done
          pattern: upcoming|open|running|done
      - description: Only programs of this type.
        in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - enterprise_challenge
          - open_innovation_call
          - accelerator
          - hackathon
          - buildathon
          - grant
          - venture_building
          - pitch_competition
          - event_series
          - event
          pattern: enterprise_challenge|open_innovation_call|accelerator|hackathon|buildathon|grant|venture_building|pitch_competition|event_series|event
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramList"
          description: The programs the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
      summary: "The published programs, the latest to start first"
      tags:
      - Programs
  /api/program/programs/{slug}:
    get:
      description: "A published program, or a draft when an operator previews it."
      operationId: getProgram
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
          description: The program.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No program is published at this address.
      summary: A program's public page
      tags:
      - Programs
  /api/storage/files/{id}:
    get:
      description: "The bytes of a file anyone may read, such as an image of a program,\
        \ or a redirect to where the object store serves them. No session is needed."
      operationId: getPublicFile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: The bytes of the file.
        "302":
          description: "The address the object store serves the file at, for a while."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No stored public file has this identifier.
      summary: A public file
      tags:
      - Storage
  /api/storage/uploads:
    post:
      description: "The first of three steps: reserve, send the bytes as the ticket\
        \ says, confirm."
      operationId: reserveUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveUpload"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
          description: The pending file and where to send its bytes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The purpose refuses this media type or this size.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller may not upload for this purpose.
      security:
      - session: []
      summary: Reserve an upload
      tags:
      - Storage
  /api/storage/uploads/{id}/confirm:
    post:
      description: Checks that the bytes arrived and are the announced file. Only
        then can the file be used.
      operationId: confirmUpload
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredFile"
          description: The stored file.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The uploaded bytes are not the announced file.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller has no such upload.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nothing has been uploaded yet.
      security:
      - session: []
      summary: Confirm an upload
      tags:
      - Storage
  /api/storage/uploads/{id}/content:
    put:
      description: The address a ticket names when the object store receives uploads
        through this application. The body is the file; the token works once.
      operationId: sendUploadContent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The bytes are written.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body is not the announced length.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The token is not valid or has been used.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller has no such pending upload.
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The ticket has expired.
      security:
      - session: []
      summary: Send the bytes of an upload
      tags:
      - Storage
components:
  schemas:
    AccountList:
      type: object
      description: "One page of accounts, latest sign-in first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
          description: How many accounts a page holds.
        total:
          type: integer
          format: int64
          description: "How many accounts match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AccountSummary:
      type: object
      description: One account in the operators' list.
      properties:
        configuredOperator:
          type: boolean
          description: "The server configuration names this address as an operator,\
            \ so the role cannot be withdrawn here."
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        lastSignInAt:
          type:
          - string
          - "null"
          format: date-time
          description: The last completed sign-in.
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
        status:
          type: string
          description: A disabled account cannot sign in.
          enum:
          - active
          - disabled
      required:
      - configuredOperator
      - createdAt
      - email
      - id
      - role
      - status
    AdminProgram:
      type: object
      description: "A program as an operator edits it, in any status."
      properties:
        about:
          type:
          - string
          - "null"
          description: The text of the standard page.
        applications:
          $ref: "#/components/schemas/ProgramApplications"
          description: Null for a program that takes no applications here.
        coverFileId:
          type:
          - string
          - "null"
          format: uuid
          description: "The cover, read at the public address of stored files."
        createdAt:
          type: string
          format: date-time
        endsOn:
          type:
          - string
          - "null"
          format: date
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProgramEvent"
        externalUrl:
          type:
          - string
          - "null"
          format: uri
        id:
          type: string
          format: uuid
        keyDates:
          type: array
          items:
            $ref: "#/components/schemas/ProgramKeyDate"
        name:
          type: string
        pageKind:
          type: string
          description: "`standard` is built from these fields, `custom` is written\
            \ in the web application for this address, `external` links to `externalUrl`."
          enum:
          - standard
          - custom
          - external
        partnerName:
          type:
          - string
          - "null"
          description: The organization the program is run with.
        publishIssues:
          type: array
          description: "What the program still lacks before it can be published, in\
            \ the order the Settings screen shows its fields. Empty when it can be\
            \ published."
          items:
            type: string
            enum:
            - summary
            - cover
            - dates
        slug:
          type: string
          description: The address under /programs.
        slugFixed:
          type: boolean
          description: "The program has been published at least once, so its address\
            \ cannot change."
        startsOn:
          type:
          - string
          - "null"
          format: date
        status:
          type: string
          description: Only a published program is public.
          enum:
          - draft
          - published
        summary:
          type:
          - string
          - "null"
          description: "One or two sentences, shown on the list."
        type:
          type: string
          enum:
          - enterprise_challenge
          - open_innovation_call
          - accelerator
          - hackathon
          - buildathon
          - grant
          - venture_building
          - pitch_competition
          - event_series
          - event
