      - description: "Use cases whose title or goal contains this, or whose organization\
          \ name does, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only use cases of this industry.
        in: query
        name: industry
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: banking_finance|insurance|retail_ecommerce|manufacturing|logistics|healthcare|education|real_estate|telecom|energy|agriculture|travel_hospitality|media_entertainment|public_sector|professional_services|technology|automotive_mobility|consumer_goods|climate_sustainability|marketing_advertising|legal|hr_workforce|other
      - description: "The order: the most recently published first, the nearest deadline\
          \ first, or the largest budget first."
        in: query
        name: sort
        required: false
