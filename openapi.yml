      operationId: sendUploadContent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The bytes are written.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body is not the announced length.
        "403":
          content:
            application/problem+json:
              schema:
