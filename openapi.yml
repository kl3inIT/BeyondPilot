      summary: The published use cases that still accept proposals
      tags:
      - Use cases
components:
  schemas:
    AccountList:
      type: object
      description: "One page of accounts, latest sign-in first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
          description: How many accounts a page holds.
        total:
          type: integer
          format: int64
          description: "How many accounts match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AccountSummary:
      type: object
      description: One account in the operators' list.
      properties:
        configuredOperator:
          type: boolean
          description: "The server configuration names this address as an operator,\
            \ so the role cannot be withdrawn here."
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        lastSignInAt:
          type:
          - string
          - "null"
          format: date-time
          description: The last completed sign-in.
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
        status:
          type: string
          description: A disabled account cannot sign in.
          enum:
          - active
          - disabled
      required:
      - configuredOperator
      - createdAt
      - email
      - id
      - role
      - status
    AddEmailSuppression:
      type: object
      description: An address to stop sending to.
      properties:
        address:
          type: string
          format: email
          maxLength: 254
          minLength: 0
      required:
      - address
    AdminCreateOrganization:
      type: object
      description: "An organization an operator creates for a company that is not\
        \ here yet. It is approved from the start and has no member until someone\
        \ accepts the invitation to own it, or claims it."
      properties:
        country:
          type:
          - string
          - "null"
          description: ISO 3166-1 alpha-2.
          pattern: "[A-Z]{2}"
        description:
          type:
          - string
          - "null"
          description: "What it does and for whom, in at most 280 characters."
          maxLength: 280
          minLength: 0
        emailDomain:
          type:
          - string
          - "null"
          description: "The domain of the company's work addresses, which the operator\
            \ vouches for."
          example: tasco.com.vn
          maxLength: 253
          minLength: 0
          pattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+"
        foundedYear:
          type:
          - integer
          - "null"
          format: int32
          description: The year it started.
          maximum: 2100
          minimum: 1800
        industries:
          type:
          - array
          - "null"
          description: "The industries it works in or serves, as the codes the solutions\
            \ use."
          items:
            type: string
            pattern: banking_finance|insurance|retail_ecommerce|manufacturing|logistics|healthcare|education|real_estate|telecom|energy|agriculture|travel_hospitality|media_entertainment|public_sector|professional_services|technology|automotive_mobility|consumer_goods|climate_sustainability|marketing_advertising|legal|hr_workforce|other
          maxItems: 5
          minItems: 0
        logoFileId:
          type:
          - string
          - "null"
          format: uuid
          description: A logo the caller uploaded for an organization; null for none.
        name:
          type: string
          maxLength: 120
          minLength: 0
        ownerEmail:
          type:
          - string
          - "null"
          format: email
          description: The address invited to own it.
          maxLength: 254
          minLength: 0
        teamSize:
          type:
          - string
          - "null"
          pattern: just_me|2_9|10_49|50_99|100_499|500_999|1000_4999|5000_plus
        type:
          type: string
          enum:
          - company
          - builder_team
          - independent_builder
          - other
          pattern: company|builder_team|independent_builder|other
        website:
          type:
          - string
          - "null"
          maxLength: 300
          minLength: 0
          pattern: "https?://[^\\s]+"
      required:
      - name
      - type
    AdminIntroduction:
      type: object
      description: "A request for an introduction as an operator reads it: the message\
        \ in full, and no address."
      properties:
        answeredAt:
          type: string
          format: date-time
          description: When it was answered; absent while it waits.
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        message:
          type: string
        overdue:
          type: boolean
          description: Whether it has waited for an answer longer than three days.
        providerOrganization:
          type: string
          description: The organization that offers the solution and answers.
        senderName:
          type: string
          description: The sender's name; absent while they have not given one.
        senderOrganization:
          type: string
          description: The organization the sender asked as.
        solutionName:
          type: string
          description: "The solution asked about, by the name it had then."
        status:
          type: string
          enum:
          - pending
          - replied
          - declined
      required:
      - createdAt
      - id
      - message
      - overdue
      - providerOrganization
      - senderOrganization
      - solutionName
      - status
    AdminIntroductionList:
      type: object
      description: "One page of requests for an introduction: those that wait first,\
        \ the longest wait on top."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminIntroduction"
        overdue:
          type: integer
          format: int64
          description: "How many requests, whatever the filter, have waited longer\
            \ than three days."
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: "How many requests match, over all pages."
      required:
      - items
      - overdue
      - page
      - pageSize
      - total
    AdminOrganization:
      type: object
      description: One organization as an operator reviews it.
      properties:
        claims:
          type: array
          description: The open requests to own it; empty for an owned organization.
          items:
            $ref: "#/components/schemas/OrganizationJoinRequest"
        createdBy:
          type: string
          description: "Who created it, as they are shown."
        createdByEmail:
          type: string
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationInvitation"
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"
        organization:
          $ref: "#/components/schemas/Organization"
        suggestedDomain:
          type:
          - string
          - "null"
          description: "A domain the operator may verify with a decision: the one\
            \ it has, else the creator's work domain while it waits for review, else\
            \ its website's. Null when another organization holds it."
      required:
      - claims
      - createdBy
      - createdByEmail
      - invitations
      - members
      - organization
    AdminOrganizationList:
      type: object
      description: "One page of organizations: those waiting for review first, then\
        \ the newest."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrganizationSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: "How many organizations match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AdminOrganizationSummary:
      type: object
      description: One organization in the operators' list.
      properties:
        askedBy:
          type:
          - string
          - "null"
          description: "Who asked for what waits, as they are shown."
        claimId:
          type:
          - string
          - "null"
          format: uuid
          description: "The oldest open claim, which the list decides first; null\
            \ without one."
        country:
          type:
          - string
          - "null"
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        members:
          type: integer
          format: int32
        name:
          type: string
        owned:
          type: boolean
          description: Whether a person owns it; an operator-created organization
            has no owner until someone accepts or claims it.
        request:
          type:
          - string
          - "null"
          description: "What waits for an operator: `new` for an organization to review,\
            \ `claim` for a request to own one; null when nothing does."
