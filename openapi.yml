    CreateUseCase:
      type: object
      description: "A use case an operator writes for an organization. It is saved\
        \ as a draft the organization's members can edit, or published at once when\
        \ publishNow is true."
      properties:
        attachmentFileIds:
          type: array
          description: "Files the caller uploaded for a use case, in the order shown."
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 0
        budgetMax:
          type:
          - integer
          - "null"
          format: int64
          description: Whole units of currency. Null while the budget is to be determined.
          maximum: 1000000000000
          minimum: 0
        budgetMembersOnly:
          type: boolean
          description: Only signed-in members see the amount.
        budgetMin:
          type:
          - integer
          - "null"
          format: int64
          description: Whole units of currency. Null while the budget is to be determined.
          maximum: 1000000000000
          minimum: 0
        budgetToBeDetermined:
          type: boolean
        closesAt:
          type: string
          format: date-time
          description: When proposals stop. It must be in the future.
        currency:
          type:
          - string
          - "null"
          description: The currency of the budget; USD when absent.
          enum:
          - USD
          - VND
          pattern: USD|VND
        currentProcess:
          type: string
          maxLength: 2000
          minLength: 0
        currentSolutions:
          type:
          - string
          - "null"
          maxLength: 2000
          minLength: 0
        dataReadiness:
          type: string
          maxLength: 2000
          minLength: 0
        expectedOutcomes:
          type: string
          maxLength: 2000
          minLength: 0
        hideOrganizationName:
          type: boolean
        industry:
          type: string
          pattern: banking_finance|insurance|retail_ecommerce|manufacturing|logistics|healthcare|education|real_estate|telecom|energy|agriculture|travel_hospitality|media_entertainment|public_sector|professional_services|technology|automotive_mobility|consumer_goods|climate_sustainability|marketing_advertising|legal|hr_workforce|other
        integrationRequirements:
          type: string
          maxLength: 2000
          minLength: 0
        organizationId:
          type: string
          format: uuid
          description: An approved organization.
        problemStatement:
          type: string
          maxLength: 2000
          minLength: 0
        programIds:
          type:
          - array
          - "null"
          description: The programs it belongs to; none when absent.
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 0
        publishNow:
          type: boolean
          description: "True to publish at once, false to save a draft for the organization."
        requirements:
          type: array
          description: "What the solution must do, in the order written."
          items:
            $ref: "#/components/schemas/UseCaseRequirement"
          maxItems: 30
          minItems: 1
        targetUsers:
          type: string
          maxLength: 2000
          minLength: 0
        technologies:
          type: array
          items:
            type: string
            pattern: generative_ai|conversational_ai|predictive_analytics|computer_vision|recommendation|document_intelligence|voice_ai|anomaly_detection|knowledge_retrieval|process_automation|other
          maxItems: 11
          minItems: 1
        timelineMaxWeeks:
          type: integer
          format: int32
          maximum: 260
          minimum: 1
        timelineMinWeeks:
          type: integer
          format: int32
          maximum: 260
          minimum: 1
        title:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - attachmentFileIds
      - budgetMembersOnly
      - budgetToBeDetermined
      - closesAt
      - currentProcess
      - dataReadiness
      - expectedOutcomes
      - hideOrganizationName
      - industry
      - integrationRequirements
      - organizationId
      - problemStatement
      - publishNow
      - requirements
      - targetUsers
      - technologies
      - timelineMaxWeeks
      - timelineMinWeeks
      - title
