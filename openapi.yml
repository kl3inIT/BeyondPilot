    ContactDetails:
      type: object
      description: How judges and GenAI Fund reach an applicant. Each part may be
        empty while the application is a draft.
      properties:
        country:
          type:
          - string
          - "null"
          description: ISO 3166-1 alpha-2.
          pattern: "^[A-Z]{2}$"
        firstName:
          type:
          - string
          - "null"
          maxLength: 80
          minLength: 0
        lastName:
          type:
          - string
          - "null"
          maxLength: 80
          minLength: 0
        linkedin:
          type:
          - string
          - "null"
          maxLength: 300
          minLength: 0
          pattern: ^https://\S+$
        phone:
          type:
          - string
          - "null"
          description: "With its country code, such as +84 912 345 678."
          maxLength: 40
          minLength: 0
          pattern: "^\\+?[0-9 ().-]*$"
    CreateOrganization:
      type: object
      description: "A new organization. Its creator owns it, and it waits for GenAI\
        \ Fund's review."
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2.
          pattern: "[A-Z]{2}"
        description:
          type: string
          description: "What it does and for whom, in at most 280 characters."
          maxLength: 280
          minLength: 0
        foundedYear:
          type: integer
          format: int32
          description: "The year it started; for an independent builder, the year\
            \ the practice did."
          maximum: 2100
          minimum: 1800
        industries:
          type: array
          description: "The industries it works in or serves, as the codes the solutions\
            \ use. A company names one to five; a team or a builder may name none."
          items:
            type: string
            pattern: banking_finance|insurance|retail_ecommerce|manufacturing|logistics|healthcare|education|real_estate|telecom|energy|agriculture|travel_hospitality|media_entertainment|public_sector|professional_services|technology|automotive_mobility|consumer_goods|climate_sustainability|marketing_advertising|legal|hr_workforce|other
          maxItems: 5
          minItems: 0
        jobTitle:
          type:
          - string
          - "null"
          description: What the creator does in the organization.
          maxLength: 120
          minLength: 0
        logoFileId:
          type:
          - string
          - "null"
          format: uuid
          description: A logo the caller uploaded for an organization; null for none.
        name:
          type: string
          maxLength: 120
          minLength: 0
        teamSize:
          type: string
          pattern: just_me|2_9|10_49|50_99|100_499|500_999|1000_4999|5000_plus
        type:
          type: string
          enum:
          - company
          - builder_team
          - independent_builder
          - other
          pattern: company|builder_team|independent_builder|other
        website:
          type: string
          maxLength: 300
          minLength: 0
          pattern: "https?://[^\\s]+"
      required:
      - country
      - description
      - foundedYear
      - industries
      - name
      - teamSize
      - type
      - website
    CreateProgram:
