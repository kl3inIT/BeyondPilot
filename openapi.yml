openapi: 3.1.0
info:
  description: The same-origin contract consumed by the BeyondPilot web application.
  title: BeyondPilot API
  version: 1.0.0
servers:
- description: Same origin as the web application
  url: /
tags:
- description: The accounts operators manage.
  name: Accounts
- description: Who is signed in.
  name: Identity
paths:
  /api/identity/accounts:
    get:
      operationId: listAccounts
      parameters:
      - description: "Accounts whose name or address contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only accounts of this status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - disabled
          pattern: active|disabled
      - description: Only accounts of this role.
        in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - user
          - operator
          pattern: user|operator
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
          description: One page of the accounts the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The accounts, latest sign-in first"
      tags:
      - Accounts
  /api/identity/accounts/{id}/disable:
    post:
      operationId: disableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is disabled.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account is the caller's own.
      security:
      - session: []
      summary: Stop an account from signing in
      tags:
      - Accounts
  /api/identity/accounts/{id}/enable:
    post:
      operationId: enableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is active.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Let a disabled account sign in again
      tags:
      - Accounts
  /api/identity/accounts/{id}/grant-operator:
    post:
      operationId: grantOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Make an account an operator
      tags:
      - Accounts
  /api/identity/accounts/{id}/withdraw-operator:
    post:
      operationId: withdrawOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is not an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The account is the caller's own, or the server configuration\
            \ names it as an operator."
      security:
      - session: []
      summary: Take the operator role from an account
      tags:
      - Accounts
  /api/identity/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The account of the session.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account has been disabled.
      security:
      - session: []
      summary: The signed-in account
      tags:
      - Identity
components:
  schemas:
    AccountList:
      type: object
      description: "One page of accounts, latest sign-in first."
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        page:
          type: integer
          format: int32
          description: "The page returned, counted from 1."
        pageSize:
          type: integer
          format: int32
          description: How many accounts a page holds.
        total:
          type: integer
          format: int64
          description: "How many accounts match, over all pages."
      required:
      - items
      - page
      - pageSize
      - total
    AccountSummary:
      type: object
      description: One account in the operators' list.
      properties:
        configuredOperator:
          type: boolean
          description: "The server configuration names this address as an operator,\
            \ so the role cannot be withdrawn here."
        createdAt:
          type: string
          format: date-time
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        lastSignInAt:
          type:
          - string
          - "null"
          format: date-time
          description: The last completed sign-in.
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
        status:
          type: string
          description: A disabled account cannot sign in.
          enum:
          - active
          - disabled
      required:
      - configuredOperator
      - createdAt
      - email
      - id
      - role
      - status
    Me:
      type: object
      description: The signed-in account.
      properties:
        displayName:
          type:
          - string
          - "null"
          description: The name the account shows; null until the person or their
            provider gives one.
        email:
          type: string
        id:
          type: string
          format: uuid
        role:
          type: string
          description: '`operator` is GenAI Fund staff.'
          enum:
          - user
          - operator
      required:
      - email
      - id
      - role
    Problem:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable failure code for module failures and request validation;
            clients branch on it.
          maxLength: 63
          pattern: "^[A-Z][A-Z0-9_]+[A-Z0-9]$"
        detail:
          type: string
          description: Safe human-readable explanation; never branch on it.
        errors:
          type: array
          description: "Request validation only: one entry per violation. A rejected\
            \ value is never echoed."
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                description: "Constraint code, for example `NOT_BLANK` or `SIZE`."
                pattern: "^[A-Z][A-Z0-9_]+[A-Z0-9]$"
              detail:
                type: string
                description: Safe fallback text; clients translate by code.
              params:
                type: object
                additionalProperties: false
                description: Numeric bounds of the constraint; omitted when it has
                  none.
                properties:
                  max:
                    type: number
                  min:
                    type: number
              pointer:
                type: string
                description: "JSON Pointer to the offending member, for example `#/title`."
            required:
            - code
            - detail
            - pointer
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        requestId:
          type: string
          format: uuid
          description: Identifier of the request in the server logs and the `X-Request-Id`
            header.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        title:
          type: string
          description: Short summary of the problem kind; never branch on it.
        type:
          type: string
          format: uri
          description: '`urn:beyondpilot:failure:<code in kebab case>` when `code`
            is present; omitted means `about:blank`.'
      required:
      - requestId
      - status
      - title
  securitySchemes:
    session:
      description: "The session cookie set by signing in. Requests that change state\
        \ also send `X-BeyondPilot-CSRF: 1`."
      in: cookie
      name: BEYONDPILOT_SESSION
      type: apiKey
