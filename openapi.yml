openapi: 3.1.0
info:
  description: The same-origin contract consumed by the BeyondPilot web application.
  title: BeyondPilot API
  version: 1.0.0
servers:
- description: Same origin as the web application
  url: /
tags:
- description: "The record of sensitive changes, read by operators."
  name: Audit
- description: The accounts operators manage.
  name: Accounts
- description: "The programs GenAI Fund runs, as the public site shows them."
  name: Programs
- description: The public directory of approved AI solutions.
  name: Solutions
- description: The public directory of approved talent profiles.
  name: Talent
- description: The organizations operators review.
  name: Organization administration
- description: The organization the caller belongs to.
  name: My organization
- description: The programs operators create and edit.
  name: Program administration
- description: Who is signed in.
  name: Identity
- description: Uploading and reading files.
  name: Storage
- description: The projects in which a customer put a solution to work.
  name: Customer deployments
- description: The caller's own talent profile.
  name: My talent profile
- description: The talent profiles operators review.
  name: Talent administration
- description: The solutions operators review.
  name: Solution administration
- description: "Finding, joining and creating an organization."
  name: Organizations
- description: The solutions of the caller's organization.
  name: My solutions
paths:
  /api/audit/events:
    get:
      operationId: listAuditEvents
      parameters:
      - description: Only events at or after this instant.
        in: query
        name: from
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: Only events of this action.
        in: query
        name: action
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - account.disable
          - account.enable
          - operator.grant
          - operator.withdraw
          - program.create
          - program.update
          - program.publish
          - program.unpublish
          - organization.create
          - organization.approve
          - organization.refuse
          - organization.claim_approve
          - organization.claim_decline
          - organization.member_role
          - organization.member_remove
          - solution.approve
          - solution.reject
          - solution.deployment_approve
          - solution.deployment_reject
          - talent.approve
          - talent.reject
      - description: "Events whose actor's name or address, or whose resource's name,\
          \ contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: "The `older` cursor of a page: the events before it. Used when\
          \ both cursors are given."
        in: query
        name: before
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      - description: "The `newer` cursor of a page: the events after it."
        in: query
        name: after
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "\\d{1,18}_[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: One page of the events the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The audit events, newest first"
      tags:
      - Audit
  /api/identity/accounts:
    get:
      operationId: listAccounts
      parameters:
      - description: "Accounts whose name or address contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only accounts of this status.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - disabled
          pattern: active|disabled
      - description: Only accounts of this role.
        in: query
        name: role
        required: false
        schema:
          type: string
          enum:
          - user
          - operator
          pattern: user|operator
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
          description: One page of the accounts the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The accounts, latest sign-in first"
      tags:
      - Accounts
  /api/identity/accounts/{id}/disable:
    post:
      operationId: disableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is disabled.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account is the caller's own.
      security:
      - session: []
      summary: Stop an account from signing in
      tags:
      - Accounts
  /api/identity/accounts/{id}/enable:
    post:
      operationId: enableAccount
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is active.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Let a disabled account sign in again
      tags:
      - Accounts
  /api/identity/accounts/{id}/grant-operator:
    post:
      operationId: grantOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
      security:
      - session: []
      summary: Make an account an operator
      tags:
      - Accounts
  /api/identity/accounts/{id}/withdraw-operator:
    post:
      operationId: withdrawOperator
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The account is not an operator.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such account.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The account is the caller's own, or the server configuration\
            \ names it as an operator."
      security:
      - session: []
      summary: Take the operator role from an account
      tags:
      - Accounts
  /api/identity/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: The account of the session.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The account has been disabled.
      security:
      - session: []
      summary: The signed-in account
      tags:
      - Identity
  /api/organization/admin/claims/{id}/approve:
    post:
      operationId: approveOrganizationClaim
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOrganization"
        required: true
      responses:
        "204":
          description: The person owns the organization.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The domain is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The claim is not open.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The person joined another organization in the meantime, or\
            \ another organization has the domain."
      security:
      - session: []
      summary: "Let a person own an organization nobody owns, and verify its email\
        \ domain"
      tags:
      - Organization administration
  /api/organization/admin/claims/{id}/decline:
    post:
      operationId: declineOrganizationClaim
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The claim is closed.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The claim is not open.
      security:
      - session: []
      summary: Decline a request to own an organization
      tags:
      - Organization administration
  /api/organization/admin/organizations:
    get:
      operationId: listAdminOrganizations
      parameters:
      - description: "Organizations whose name or domain contains this, ignoring case."
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - description: Only organizations of this review status; `pending` also selects
          an approved one with an open claim.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
          pattern: pending|approved|rejected
      - description: "The page, counted from 1."
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganizationList"
          description: One page of the organizations the parameters select.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A parameter is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
      security:
      - session: []
      summary: "The organizations, those waiting for review first"
      tags:
      - Organization administration
    post:
      operationId: createAdminOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateOrganization"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
          description: "The organization, approved and without an owner."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A member is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Another organization has the email domain.
      security:
      - session: []
      summary: Create an organization for a company that is not here yet
      tags:
      - Organization administration
  /api/organization/admin/organizations/{id}:
    get:
      operationId: getAdminOrganization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
          description: "The organization, its people and the requests to own it."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such organization.
      security:
      - session: []
      summary: One organization as an operator reviews it
      tags:
      - Organization administration
  /api/organization/admin/organizations/{id}/approve:
    post:
      operationId: approveOrganization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOrganization"
        required: true
      responses:
        "204":
          description: The organization is approved.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The domain is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such organization.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The organization is not waiting for review, or another organization\
            \ has the domain."
      security:
      - session: []
      summary: "Approve an organization that waits for review, and verify its email\
        \ domain"
      tags:
      - Organization administration
  /api/organization/admin/organizations/{id}/refuse:
    post:
      operationId: refuseOrganization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefuseOrganization"
        required: true
      responses:
        "204":
          description: "The organization is refused, with the reason."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A member is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller is not an operator.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: There is no such organization.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The organization is not waiting for review.
      security:
      - session: []
      summary: Refuse an organization that waits for review
      tags:
      - Organization administration
  /api/organization/invitations/{id}/accept:
    post:
      operationId: acceptOrganizationInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The caller belongs to the organization.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No open invitation to the caller has this identifier.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The caller already belongs to an organization.
      security:
      - session: []
      summary: Accept an invitation to the caller's address
      tags:
      - Organizations
  /api/organization/invitations/{id}/decline:
    post:
      operationId: declineOrganizationInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The invitation is closed.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: No open invitation to the caller has this identifier.
      security:
      - session: []
      summary: Decline an invitation to the caller's address
      tags:
      - Organizations
  /api/organization/join-request/withdraw:
    post:
      operationId: withdrawJoinRequest
      responses:
        "204":
          description: The caller waits on no request.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
      security:
      - session: []
      summary: Withdraw the request the caller waits on
      tags:
      - Organizations
  /api/organization/mine:
    get:
      operationId: getMyOrganization
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOrganization"
          description: Where the caller stands.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
      security:
      - session: []
      summary: "The caller's organization, or their ways into one"
      tags:
      - My organization
    put:
      operationId: saveMyOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveOrganization"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: "The organization as saved, with its new version."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A member is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The caller belongs to no organization, or is not an owner\
            \ of it."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The organization changed since it was read.
      security:
      - session: []
      summary: Save the profile of the caller's organization
      tags:
      - My organization
  /api/organization/mine/auto-join:
    put:
      operationId: changeOrganizationAutoJoin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoJoin"
        required: true
      responses:
        "204":
          description: The setting is saved.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The value is missing.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The caller belongs to no organization, or is not an owner\
            \ of it."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Turned on for an organization that is not approved or has no
            verified domain.
      security:
      - session: []
      summary: "Let addresses on the organization's verified domain join without asking,\
        \ or stop that"
      tags:
      - My organization
  /api/organization/mine/invitations:
    post:
      operationId: inviteOrganizationMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMember"
        required: true
      responses:
        "204":
          description: The invitation is open and the address was told.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: A member is not valid.
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Nobody is signed in.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The caller belongs to no organization, or is not an owner\
            \ of it."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The organization is not approved, or the address already belongs\
            \ to it or already holds an open invitation."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "The organization sent the most invitations it can in a day,\
            \ or keeps the most it can open."
      security:
      - session: []
      summary: Ask an address to join the caller's organization
      tags:
      - My organization
  /api/organization/mine/invitations/{id}/revoke:
    post:
      operationId: revokeOrganizationInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The invitation is closed.
