# Local development only: Spring Boot Docker Compose support starts this on `bootRun`.
services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=beyondpilot'
      - 'POSTGRES_USER=beyondpilot'
      - 'POSTGRES_PASSWORD=beyondpilot'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
