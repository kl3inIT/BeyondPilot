# Local development only: Spring Boot Docker Compose support starts this on `bootRun`.
services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=beyondpilot'
      - 'POSTGRES_USER=beyondpilot'
      - 'POSTGRES_PASSWORD=beyondpilot'
    ports:
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
  # Catches every email the application sends; read them at http://localhost:8025.
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
