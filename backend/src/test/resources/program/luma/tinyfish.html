<script type="application/ld+json">{"@context":"https://schema.org","@type":"Event","@id":"https://luma.com/gaf-tinyfish-vn","url":"https://luma.com/gaf-tinyfish-vn","name":"TinyFish, Big Minds","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","image":["https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1920,height=1920/uploads/5m/b3a97ce1-cb9e-4cee-96f4-95690324bee4.png","https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1200,height=630/event-social/0a/dc3217ff-f03a-47ee-bb60-157d8d0ca36c.png"],"description":"A private dinner for Vietnam's strongest CTOs, CIOs and AI engineers, with TinyFish's leadership.\nTinyFish just opened its Vietnam office, its second worldwide after its US headquarters. Its leadership team is flying into Ho Chi Minh City, and GenAI Fund is hosting a dinner with them for 30 hand-picked technology leaders and engineers.\nNo panels. No pitch decks. Just two hours of real conversation with people who build.\n\nWhy TinyFish\nTinyFish builds live-web infrastructure for AI agents. TinySearch, TinyFetch, TinyBrowser and TinyAgent let enterprise agents find information, read live pages and complete complex web workflows at scale.\nThe core team behind TinyFish's web-native model is here in Vietnam. It's built to run real workflows on the live web, reliably, at a fraction of frontier-model cost.\nUS$47M Series A led by ICONIQ, with USVP, Mango Capital, MongoDB Ventures, ASG and Sandberg Bernthal Venture Partners\n8,000 → 350,000 users in five months\n500+ teams worldwide use TinyFish\nFrom TinyFish at the table\nKeith Zhai — Co-founder & COO\nMark Peng — CTO\nDaisy Hoang — CRO\nPasha Dudka — Head of Engineering\nFlorence Trang Le — Head of Marketing\n\nWho this room is for, and what you get\n🚀 Startup CTOs\nYou're betting your roadmap on agents. Compare notes with TinyFish's CTO and Head of Engineering on what breaks when agents hit the live web, and how to make them reliable without frontier-model bills.\n🏢 Enterprise CIOs\nYour board wants agents in production. Your team wants proof first. Hear how 500+ teams deploy TinyFish, and meet the startup CTOs building what you might buy next.\n🧠 Top AI engineers\nStartup, enterprise, research lab or independent: it doesn't matter where you work. If you do serious AI work, sit with the Vietnam team behind TinyFish's model, and with the CTOs and CIOs who'd want you on their team.\nWe balance the room across all three, so every conversation crosses perspectives.\n\nHow the evening runs\n🗣️ 6:00 PM · TinyFish shares (30 min)\nWhat they're building, what's next in Vietnam, and open Q&A.\n🔄 6:30 PM · Meet the minds (45 min)\nEvery guest gets 60 seconds: what you're building or leading, plus one question for the room. Facilitated by GenAI Fund.\n🍽️ 7:15 PM · Dinner & connections\nKeep the conversations going over food.\n\nRequest your seat\nWe select on the quality of your work, not your title. Tell us what you're building or leading: a product, a platform, a paper, a GitHub profile or a few lines about your work. We review every request and confirm by email. Confirmed guests receive the venue details.\nGot a direct invite from us? You skip the review queue. Just RSVP.\nTinyFish × GenAI Fund","startDate":"2026-10-26T18:00:00.000+07:00","endDate":"2026-10-26T20:00:00.000+07:00","organizer":[{"@type":"Organization","name":"GenAI Fund - Official","url":"https://luma.com/gaf","image":"https://images.lumacdn.com/uploads/mz/4ba288ee-6348-4d2b-9bdc-8e7e677ad70f.png"},{"@type":"Person","name":"Kai Yong","url":"https://luma.com/user/kaiyong","image":"https://cdn.lu.ma/avatars-default/avatar_26.png"}],"offers":[{"@type":"Offer","url":"https://luma.com/gaf-tinyfish-vn","name":"General Admission","price":0,"priceCurrency":"usd","availability":"https://schema.org/InStock"}]}</script>
