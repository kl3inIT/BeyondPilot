spring:
  application:
    name: beyondpilot
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    hikari:
      # A fixed-size pool: opening connections when load arrives is the slowest moment to do it.
      pool-name: beyondpilot
      maximum-pool-size: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      minimum-idle: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      # Fail while the caller still waits, retire connections before the network drops them,
      # and report a connection that was borrowed and never returned.
      connection-timeout: 10000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false

  session:
    # Idle time after which a sign-in ends; each request restarts it.
    timeout: 30d
    jdbc:
      # Flyway creates the session tables.
      initialize-schema: never
  modulith:
    events:
      # Only module listeners are recorded; an in-module @TransactionalEventListener, such as a confirmation mail,
      # stays a plain after-commit call and its event is never stored.
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # A completed publication is deleted, so the table holds only what is still to be delivered.
      completion-mode: delete
      # One instance runs, so on startup every publication left incomplete is its own to deliver again.
      republish-outstanding-events-on-restart: true
      jdbc:
        # Flyway creates the event publication table.
        schema-initialization:
          enabled: false
  ai:
    model:
      # Search builds its embedding client from the provider operators connect in Admin › AI › Providers; Spring AI
      # configures no model of its own.
      embedding: none
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false

  http:
    clients:
      imperative:
        # The JDK's client, as before Apache HttpClient joined the classpath for the authorization server's own
        # fetches of addresses outsiders name (identity.oauth.OutsideHttp).
        factory: jdk

server:
  # The web application and the reverse proxy forward the browser's host and scheme.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: BEYONDPILOT_SESSION
        http-only: true
        same-site: lax
        # The browser keeps the cookie across restarts; the session timeout above decides when the sign-in ends.
        max-age: 365d

beyondpilot:
  notification:
    # Who delivers email is chosen by operators in Admin › Email and stored in the database; the provider's secrets
    # are encrypted with this key (32 bytes in Base64). Without it no secret can be saved, and email waits.
    encryption-key: ${BEYONDPILOT_NOTIFICATION_ENCRYPTION_KEY:}
    # The public address of the site: emails read the GenAI Fund logo from it.
    site-url: ${BEYONDPILOT_SITE_URL:http://localhost:3000}
  identity:
    sign-in-code-lifetime: 15m
    oauth:
      # The public address of BeyondPilot: it names the authorization server AI apps sign in through and both MCP
      # servers (BEY-78).
      issuer: ${BEYONDPILOT_SITE_URL:http://localhost:3000}
      # The RSA private key (PKCS#8 PEM) that signs access tokens, a secret file of the deployment. Without it a key is
      # made at each start, so tokens do not survive a restart.
      signing-key: ${BEYONDPILOT_IDENTITY_OAUTH_SIGNING_KEY:}
    # BEYONDPILOT_IDENTITY_OPERATOR_EMAILS lists the addresses that are operators from their first sign-in.
    # Google sign-in is on when BEYONDPILOT_IDENTITY_GOOGLE_CLIENT_ID and _CLIENT_SECRET are set.
  usecase:
    # Đồng per US dollar, used only to order the public list by budget when budgets are in both currencies.
    vnd-per-usd: ${BEYONDPILOT_USECASE_VND_PER_USD:26000}
  storage:
    # `local` keeps files in a directory; `s3` keeps them in a bucket and the browser uploads straight to it.
    provider: ${BEYONDPILOT_STORAGE_PROVIDER:local}
    local:
      directory: ${BEYONDPILOT_STORAGE_LOCAL_DIRECTORY:build/storage}
    s3:
      bucket: ${BEYONDPILOT_STORAGE_S3_BUCKET:}
      region: ${BEYONDPILOT_STORAGE_S3_REGION:}
      endpoint: ${BEYONDPILOT_STORAGE_S3_ENDPOINT:}
  ai:
    # 32 bytes in Base64 that encrypt the AI providers' keys in the database. Without it no key can be saved, and
    # search goes by keywords alone.
    encryption-key: ${BEYONDPILOT_AI_ENCRYPTION_KEY:}
  search:
    embedding:
      # How many rows one request embeds, and how often the job looks for rows to embed.
      batch-size: 32
      # Passages are many more than items: a solution has one row and dozens of passages. 64 a minute embeds
      # the 22,000 of the imported solutions in about six hours.
      passage-batch-size: 64
      interval: 1m
      # The vector branch keeps what is at least this similar to the query (cosine). Measured on 6 October with
      # text-embedding-3-large at 1,536 dimensions: relevant items 0.38 to 0.64, nonsense 0.18 to 0.22.
      min-similarity: 0.35
      # The nearest the vector branch takes before ranking; an approximate index returns only its nearest.
      pool: 48
    passages:
      # How often the job looks for decks attached or replaced since their pages were read; it reads five a run.
      interval: 1m
  matching:
    # How many solutions a run judges, one call each. The probe of 9 October: past the first 40, seven judgments in
    # ten found nothing.
    candidates: 40
    # How many candidates are judged at the same time.
    parallel: 4
    # How often the worker looks for a run to take; it works on one at a time.
    interval: 10s
    # How long a run stops after the provider refused a call. The 9Router route let calls through again two minutes
    # after its limit was reached.
    pause: 2m
    # A run that stops this many times in a row without judging anything ends as failed.
    max-stalls: 5

springdoc:
  # OpenApiContractTest generates openapi.yml; no runtime profile serves the contract.
  api-docs:
    enabled: false
  paths-to-match: /api/**
  writer-with-order-by-keys: true
