spring:
  application:
    name: beyondpilot
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    hikari:
      # A fixed-size pool: opening connections when load arrives is the slowest moment to do it.
      pool-name: beyondpilot
      maximum-pool-size: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      minimum-idle: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      # Fail while the caller still waits, retire connections before the network drops them,
      # and report a connection that was borrowed and never returned.
      connection-timeout: 10000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false

  session:
    # Idle time after which a sign-in ends; each request restarts it.
    timeout: 30d
    jdbc:
      # Flyway creates the session tables.
      initialize-schema: never
  modulith:
    events:
      # Only module listeners are recorded; an in-module @TransactionalEventListener, such as a confirmation mail,
      # stays a plain after-commit call and its event is never stored.
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # A completed publication is deleted, so the table holds only what is still to be delivered.
      completion-mode: delete
      # One instance runs, so on startup every publication left incomplete is its own to deliver again.
      republish-outstanding-events-on-restart: true
      jdbc:
        # Flyway creates the event publication table.
        schema-initialization:
          enabled: false

server:
  # The web application and the reverse proxy forward the browser's host and scheme.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: BEYONDPILOT_SESSION
        http-only: true
        same-site: lax
        # The browser keeps the cookie across restarts; the session timeout above decides when the sign-in ends.
        max-age: 365d

beyondpilot:
  notification:
    # Who delivers email is chosen by operators in Admin › Email and stored in the database; the provider's secrets
    # are encrypted with this key (32 bytes in Base64). Without it no secret can be saved, and email waits.
    encryption-key: ${BEYONDPILOT_NOTIFICATION_ENCRYPTION_KEY:}
    # The public address of the site: emails read the GenAI Fund logo from it.
    site-url: ${BEYONDPILOT_SITE_URL:http://localhost:3000}
  identity:
    sign-in-code-lifetime: 15m
    # BEYONDPILOT_IDENTITY_OPERATOR_EMAILS lists the addresses that are operators from their first sign-in.
    # Google sign-in is on when BEYONDPILOT_IDENTITY_GOOGLE_CLIENT_ID and _CLIENT_SECRET are set.
  storage:
    # `local` keeps files in a directory; `s3` keeps them in a bucket and the browser uploads straight to it.
    provider: ${BEYONDPILOT_STORAGE_PROVIDER:local}
    local:
      directory: ${BEYONDPILOT_STORAGE_LOCAL_DIRECTORY:build/storage}
    s3:
      bucket: ${BEYONDPILOT_STORAGE_S3_BUCKET:}
      region: ${BEYONDPILOT_STORAGE_S3_REGION:}
      endpoint: ${BEYONDPILOT_STORAGE_S3_ENDPOINT:}

springdoc:
  # OpenApiContractTest generates openapi.yml; no runtime profile serves the contract.
  api-docs:
    enabled: false
  paths-to-match: /api/**
  writer-with-order-by-keys: true
