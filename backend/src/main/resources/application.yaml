spring:
  application:
    name: beyondpilot
  threads:
    virtual:
      enabled: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    hikari:
      # A fixed-size pool: opening connections when load arrives is the slowest moment to do it.
      pool-name: beyondpilot
      maximum-pool-size: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      minimum-idle: ${BEYONDPILOT_DATABASE_POOL_SIZE:10}
      # Fail while the caller still waits, retire connections before the network drops them,
      # and report a connection that was borrowed and never returned.
      connection-timeout: 10000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false

  session:
    # Idle time after which a sign-in ends; each request restarts it.
    timeout: 30d
    jdbc:
      # Flyway creates the session tables.
      initialize-schema: never
  modulith:
    events:
      # Only module listeners are recorded; an in-module @TransactionalEventListener, such as a confirmation mail,
      # stays a plain after-commit call and its event is never stored.
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # A completed publication is deleted, so the table holds only what is still to be delivered.
      completion-mode: delete
      # One instance runs, so on startup every publication left incomplete is its own to deliver again.
      republish-outstanding-events-on-restart: true
      jdbc:
        # Flyway creates the event publication table.
        schema-initialization:
          enabled: false
  ai:
    model:
      # Search embeds its index and each query; nothing else of OpenAI's is used. Embeddings are on where a deployment
      # names a provider and its key (BEYONDPILOT_AI_EMBEDDING=openai), so local runs and tests search by text alone.
      embedding: ${BEYONDPILOT_AI_EMBEDDING:none}
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
    openai:
      # Any OpenAI-compatible API: OpenAI itself, or OpenRouter at https://openrouter.ai/api/v1. The key is a secret
      # file of the deployment, BEYONDPILOT_AI_API_KEY.
      base-url: ${BEYONDPILOT_AI_BASE_URL:https://api.openai.com/v1}
      api-key: ${BEYONDPILOT_AI_API_KEY:}
      # A query waits for its embedding; the search answers by text alone rather than wait longer.
      timeout: 5s
      max-retries: 1
      embedding:
        # OpenRouter names it openai/text-embedding-3-large. The dimensions are the vector(1536) column's.
        model: ${BEYONDPILOT_AI_EMBEDDING_MODEL:text-embedding-3-large}
        dimensions: 1536
        metadata-mode: none
  mail:
    # Local development delivers to the Mailpit container of backend/compose.yaml; nothing leaves the machine.
    host: ${BEYONDPILOT_MAIL_HOST:localhost}
    port: ${BEYONDPILOT_MAIL_PORT:1025}

server:
  # The web application and the reverse proxy forward the browser's host and scheme.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: BEYONDPILOT_SESSION
        http-only: true
        same-site: lax
        # The browser keeps the cookie across restarts; the session timeout above decides when the sign-in ends.
        max-age: 365d

beyondpilot:
  identity:
    sign-in-code-lifetime: 15m
    # BEYONDPILOT_IDENTITY_OPERATOR_EMAILS lists the addresses that are operators from their first sign-in.
    # Google sign-in is on when BEYONDPILOT_IDENTITY_GOOGLE_CLIENT_ID and _CLIENT_SECRET are set.
  storage:
    # `local` keeps files in a directory; `s3` keeps them in a bucket and the browser uploads straight to it.
    provider: ${BEYONDPILOT_STORAGE_PROVIDER:local}
    local:
      directory: ${BEYONDPILOT_STORAGE_LOCAL_DIRECTORY:build/storage}
    s3:
      bucket: ${BEYONDPILOT_STORAGE_S3_BUCKET:}
      region: ${BEYONDPILOT_STORAGE_S3_REGION:}
      endpoint: ${BEYONDPILOT_STORAGE_S3_ENDPOINT:}
  notification:
    from: ${BEYONDPILOT_MAIL_FROM:BeyondPilot <no-reply@beyondpilot.localhost>}
  search:
    embedding:
      # How many rows one request embeds, and how often the job looks for rows to embed.
      batch-size: 32
      interval: 1m
      # The vector branch keeps what is at least this similar to the query (cosine). Measured on 6 October with
      # text-embedding-3-large at 1,536 dimensions: relevant items 0.38 to 0.64, nonsense 0.18 to 0.22.
      min-similarity: 0.35
      # The nearest the vector branch takes before ranking; an approximate index returns only its nearest.
      pool: 48

springdoc:
  # OpenApiContractTest generates openapi.yml; no runtime profile serves the contract.
  api-docs:
    enabled: false
  paths-to-match: /api/**
  writer-with-order-by-keys: true
