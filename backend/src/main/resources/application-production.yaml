# Every deployed environment runs this profile; staging adds `staging` on top.
# Database settings have no defaults so a missing value stops startup.
spring:
  config:
    # A secret is a file named after its variable, mounted under /run/secrets; it is never in the environment of the
    # container, where `docker inspect` and a crash report would show it.
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${BEYONDPILOT_DATABASE_URL}
    username: ${BEYONDPILOT_DATABASE_USERNAME}
    password: ${BEYONDPILOT_DATABASE_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

# Sign-in settings have no defaults either: a deployment without them does not start.
beyondpilot:
  identity:
    google:
      client-id: ${BEYONDPILOT_IDENTITY_GOOGLE_CLIENT_ID}
      client-secret: ${BEYONDPILOT_IDENTITY_GOOGLE_CLIENT_SECRET}
  storage:
    # No default: a deployment says where its files are kept.
    provider: ${BEYONDPILOT_STORAGE_PROVIDER}
  notification:
    # No default: an email must name the site it comes from.
    site-url: ${BEYONDPILOT_SITE_URL}

logging:
  structured:
    format:
      console: logstash
