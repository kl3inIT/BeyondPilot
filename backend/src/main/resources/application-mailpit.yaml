# An environment whose email goes to the Mailpit container of its composition: staging always, and production until
# it has an email provider. Nothing leaves the host, so the SMTP login and STARTTLS that production requires do not
# apply.
spring:
  mail:
    username: ${BEYONDPILOT_MAIL_USERNAME:}
    password: ${BEYONDPILOT_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.required: false
