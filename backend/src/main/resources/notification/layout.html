<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
  @media (max-width: 620px) {
    .bp-email { border: 0 !important; border-radius: 0 !important; }
    .bp-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .bp-outer { padding: 0 !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F6F9FC;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F6F9FC;">{{preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F9FC" style="background-color:#F6F9FC;">
<tr>
<td class="bp-outer" align="center" style="padding:32px 16px;">
<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="bp-email" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="max-width:600px;background-color:#FFFFFF;border:1px solid #E3EAF2;border-radius:8px;border-collapse:separate;">
<tr>
<td class="bp-pad" style="padding:24px 40px;border-bottom:1px solid #E3EAF2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td valign="middle"><img src="{{logoUrl}}" alt="GenAI Fund" width="140" height="29" style="display:block;width:140px;height:29px;border:0;outline:none;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#0B1B2E;"></td>
<td valign="middle" align="right" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#4B5D75;">BeyondPilot</td>
</tr>
</table>
</td>
</tr>
<tr>
<td class="bp-pad" style="padding:36px 40px 16px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#0B1B2E;">
{{{body}}}
</td>
</tr>
{{#quote}}
<tr>
<td class="bp-pad" style="padding:0 40px 24px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F9FC" style="background-color:#F6F9FC;border-left:3px solid #DCE5EF;border-radius:4px;">
<tr>
<td style="padding:16px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<div style="font-size:12px;line-height:18px;font-weight:600;color:#4B5D75;margin:0 0 6px 0;">{{quoteLabel}}</div>
<div style="font-size:16px;line-height:26px;color:#0B1B2E;">{{{quote}}}</div>
</td>
</tr>
</table>
</td>
</tr>
{{/quote}}
<tr>
<td class="bp-pad" style="padding:0 40px 40px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#4B5D75;">
The BeyondPilot team at GenAI Fund
</td>
</tr>
<tr>
<td class="bp-pad" bgcolor="#0B1B2E" style="padding:28px 40px;background-color:#0B1B2E;border-radius:0 0 7px 7px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<img src="{{logoOnDarkUrl}}" alt="GenAI Fund" width="132" height="27" style="display:block;width:132px;height:27px;border:0;outline:none;text-decoration:none;font-size:15px;font-weight:600;color:#FFFFFF;">
<div style="margin:16px 0 0 0;font-size:12px;line-height:18px;font-weight:600;color:#FFFFFF;">BeyondPilot by GenAI Fund</div>
<div style="margin:4px 0 0 0;font-size:12px;line-height:18px;color:#B9C4D2;"><a href="{{siteUrl}}" style="color:#B9C4D2;text-decoration:none;">{{siteHost}}</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="https://genaifund.ai" style="color:#B9C4D2;text-decoration:none;">genaifund.ai</a></div>
<div style="margin:16px 0 0 0;font-size:12px;line-height:18px;color:#8A9AAE;">{{{footer}}}</div>
</td>
</tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td>
</tr>
</table>
</body>
</html>
