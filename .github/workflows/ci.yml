name: CI

# Every branch push runs CI, so a feature branch is verified before main is fast-forwarded onto it,
# and pull requests from branches of this repository show the same runs.
"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run per branch; a newer commit contains the older one, so finishing the older run proves nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Workflows and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Scan history for secrets with a checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Includes the Modulith architecture test and the openapi.yml drift check; Testcontainers uses the runner's Docker.
      - name: Build and verify
        run: ./gradlew :backend:check --no-daemon

      - name: Upload backend test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm at the version web/package.json pins in packageManager, without Corepack.
      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          working-directory: web
          cache: true
          require-lockfile: true

      # The generated-client drift check, ESLint, Prettier, tsc, the message catalogs and knip.
      - name: Verify
        run: pnpm --dir web check

      - name: Audit dependencies
        run: pnpm --dir web audit --audit-level=high

  e2e:
    name: Web end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          working-directory: web
          cache: true
          require-lockfile: true

      # Both Playwright projects (desktop and Pixel 7) run on Chromium.
      - name: Install Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Build and test in the browser
        run: pnpm --dir web test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loaded under the names compose.local.yaml gives them, so the composition below runs these exact builds.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: beyondpilot-api:local
          build-args: VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: beyondpilot-web:local
          build-args: VCS_REF=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      # The images start, Flyway migrates an empty database, and the proxy routes Spring's paths to the api
      # (an anonymous /api call is refused there) and every other path to the web application.
      - name: Start the composition and exercise its routes
        run: |
          compose=(docker compose -f infrastructure/deployment/compose.base.yaml -f infrastructure/deployment/compose.local.yaml)
          "${compose[@]}" up --no-build --wait --wait-timeout 240
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/identity/me)" = 401
          for image in beyondpilot-api:local beyondpilot-web:local; do
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          done

      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose -f infrastructure/deployment/compose.base.yaml -f infrastructure/deployment/compose.local.yaml logs --no-color --tail 200
