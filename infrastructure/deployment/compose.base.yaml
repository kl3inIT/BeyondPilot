# The services every BeyondPilot composition runs. An overlay adds where the images come from, how the
# secrets arrive and which networks reach the services: compose.local.yaml on a workstation,
# compose.staging.yaml on the staging host. No service publishes a port here.
name: beyondpilot

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_DB: beyondpilot
      POSTGRES_USER: beyondpilot
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=beyondpilot", "--dbname=beyondpilot"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  api:
    restart: unless-stopped
    volumes:
      - storage:/var/lib/beyondpilot/storage
    depends_on:
      postgres:
        condition: service_healthy
    # The image carries no HTTP client; Bash's /dev/tcp asks the actuator directly. Flyway runs before the
    # health endpoint answers, so the start period covers a migration.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    networks:
      - internal

  web:
    restart: unless-stopped
    environment:
      # Server rendering calls the backend directly; the browser reaches it through the reverse proxy.
      BEYONDPILOT_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal

  # Every email the application sends stays here; the team reads sign-in codes in its web interface.
  mailpit:
    image: axllent/mailpit:v1.30@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    restart: unless-stopped
    networks:
      - internal

networks:
  internal: {}

volumes:
  postgres-data: {}
  # Uploaded files of the local store.
  storage: {}
