# The whole stack on a workstation, built from this checkout, in one command from the repository root:
#   docker compose -f infrastructure/deployment/compose.base.yaml -f infrastructure/deployment/compose.local.yaml up --build --wait
# It runs without a Spring profile, so the development credentials below are the only ones it knows.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: beyondpilot

  api:
    image: beyondpilot-api:local
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      # Without a profile the application reads Spring's own datasource settings.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beyondpilot
      SPRING_DATASOURCE_USERNAME: beyondpilot
      SPRING_DATASOURCE_PASSWORD: beyondpilot
      BEYONDPILOT_IDENTITY_OPERATOR_EMAILS: ${BEYONDPILOT_IDENTITY_OPERATOR_EMAILS:-}

  web:
    image: beyondpilot-web:local
    build:
      context: ../..
      dockerfile: web/Dockerfile

  # Stands in for the reverse proxy of a deployed host: Spring's paths go to the api, the rest to the web.
  proxy:
    image: nginx:1.31-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: unless-stopped
    volumes:
      - ./local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal
