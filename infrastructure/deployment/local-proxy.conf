# The routing of the deployed reverse proxy (docs/runbooks/ci-cd.md), for compose.local.yaml.
server {
    listen 80;
    # The largest file the storage module accepts is a 100 MB solution deck.
    client_max_body_size 105m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # The edge sets the client address itself and drops Forwarded, which Spring reads first: a value the client wrote
    # would be read as its address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";

    location ~ ^/(api|login|logout|oauth2|ott|\.well-known/oauth-authorization-server)(/|$) {
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
